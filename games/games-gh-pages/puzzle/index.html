<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8" />
    <title>Puzzle</title>
    <link rel="stylesheet" href="design/style.css" />
    <script type="module" src="source/Main.js"></script>
</head>

<body>
    <header>
        <h1>Puzzle</h1>
        <ul class="menu">
            <li><button data-action="preview">Pre<u>v</u>iew</button></li>
            <li><button data-action="pause"><u>P</u>ause</button></li>
            <li><button data-action="mute" class="mute"><u>M</u>ute</button></li>
            <li><button data-action="exit"><u>E</u>xit</button></li>
        </ul>
        <div class="score">
            <span class="placed">0</span>
            <span class="total"></span>
            <span class="percent"></span>
            <span class="timer"></span>
        </div>
    </header>

    <div class="selection">
        <h2>Select a Puzzle</h2>
        <ul class="selection-tabs"></ul>
        <p class="selection-pack"></p>
        <div class="slider-container">
            <div class="slider-content">
                <ul class="slider-list"></ul>
            </div>
            <nav class="slider-nav">
                <a href="#" class="slider-prev" data-action="prev"></a>
                <a href="#" class="slider-next" data-action="next"></a>
            </nav>
        </div>
        <footer>
            <p class="selection-desc"></p>
            <button data-action="start"></button>
        </footer>
    </div>

    <div class="pause backdrop">
        <div class="dialog">
            <h2>Pause</h2>
            <p>The game is currently paused</p>
            <button data-action="pause">Continue playing</button>
        </div>
    </div>

    <div class="congrats backdrop">
        <div class="dialog">
            <h2>Congratulations!</h2>
            <p>You completed the puzzle</p>
            <button data-action="restart">Select a new puzzle</button>
        </div>
    </div>

    <div class="container">
        <div class="table">
            <div class="content">
                <div class="board"></div>
            </div>
        </div>
        <div class="drawer">
            <ul class="actions">
                <li><button class="action-borders" data-action="borders">Only <u>B</u>orders</button></li>
                <li><button class="action-split" data-action="split"><u>S</u>plit</button></li>
            </ul>
            <div class="primary"></div>
            <div class="secondary"></div>
        </div>
    </div>

    <div class="preview" data-action="preview">
        <a href="#" class="close"></a>
        <img src="" alt="" />
    </div>
	<script src="/js/ads.js"></script>

<script>
(function(){
  if (window.__NEON_CLASSIC_INTERSTITIALS__) return;
  window.__NEON_CLASSIC_INTERSTITIALS__ = true;

  var lastAdTime = 0;
  var COOLDOWN_MS = 60000;

  function showGameBreakAd(reason, force) {
    var now = Date.now();
    if (!force && now - lastAdTime < COOLDOWN_MS) return false;
    lastAdTime = now;

    try {
      if (window.NeonAds && typeof window.NeonAds.showGameBreakAd === 'function') {
        window.NeonAds.showGameBreakAd();
        return true;
      }
    } catch (e) {
      console.warn('Neon game-break ad failed:', reason, e);
    }
    return false;
  }

  function isVisible(el) {
    if (!el) return false;
    var cs = window.getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return false;
    return el.offsetWidth > 0 || el.offsetHeight > 0 || el.getClientRects().length > 0;
  }

  var selectors = [
    '.gameover-menu',
    '.congrats',
    '.input',
    '#gameOverScreen',
    '.game-over',
    '.messages .input',
    '.dialog.congrats',
    '.congrats.backdrop'
  ];

  var seenVisible = new WeakMap();

  function scanForBreaks() {
    selectors.forEach(function(selector) {
      document.querySelectorAll(selector).forEach(function(el) {
        var visible = isVisible(el);
        var wasVisible = seenVisible.get(el) === true;
        seenVisible.set(el, visible);
        if (visible && !wasVisible) {
          showGameBreakAd(selector, false);
        }
      });
    });
  }

  document.addEventListener('click', function(e) {
    var actionEl = e.target && e.target.closest && e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = (actionEl.getAttribute('data-action') || '').toLowerCase();
    if (/finishgame|endgame|maindisplay|mainscreen|restart|newgame|save/.test(action)) {
      showGameBreakAd('menu-action-' + action, false);
    }
  }, true);

  var observer = new MutationObserver(function(){ scanForBreaks(); });
  if (document.body) {
    observer.observe(document.body, { attributes:true, childList:true, subtree:true, attributeFilter:['class','style'] });
  }

  window.addEventListener('NEON_GAME_OVER', function(){ showGameBreakAd('custom-game-over', true); });
  window.addEventListener('NEON_LEVEL_COMPLETE', function(){ showGameBreakAd('custom-level-complete', false); });

  setInterval(scanForBreaks, 1500);
  setTimeout(scanForBreaks, 1000);
})();
</script>

</body>
</html>
